name: Telegram Daily Market Report

on:
  schedule:
    # 00:30 UTC = 07:30 Asia/Ho_Chi_Minh
    - cron: "30 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: telegram-daily-market-report
  cancel-in-progress: false

jobs:
  send-report:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          pip install -e .

      - name: Send 07:30 market report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          BOT_TIMEZONE: Asia/Ho_Chi_Minh
          NEWS_LOOKBACK_HOURS: "30"
          MAX_NEWS_ITEMS: "8"
        run: python -m telegram_market_bot.send_once
